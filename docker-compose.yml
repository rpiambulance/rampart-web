# Rampart Admin console — joins the running `central` stack's network.
# Bring up the full platform from ../central first (docker compose up -d),
# then: docker compose up -d --build
services:
  admin:
    build: .
    ports:
      - '3002:3000'
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me}
      AUTH_URL: http://localhost:3002
      AUTH_TRUST_HOST: 'true'
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:-rampart-admin}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-dev-secret-admin}
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER:-http://keycloak:8080/realms/rampart}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-true}
      RAMPART_API_URL: http://api:3001
    networks:
      - central
networks:
  central:
    external: true
    name: central_default
